loading_phrase = 1992, su primer álbum al margen de Duncan Dhu, Naufragios, superó el disco de platino , sobre todo gracias a canciones como A un minuto de ti (Nº 1 de Los 40 Principales el 26 de diciembre de 1992) o Esta luz nunca se apagará (Nº 1 de Los 40 Principales el 24 de abril de 1993), una fantástica versión y adaptación al español del clásico de The Smiths, There's a light that never goes out.
