loading_phrase = On 15 May 1992, during a performance in Culiacán, Sánchez was handed a note from someone in the crowd. The note is commonly believed to have been a death threat warning that he would be killed that night, but this has never been confirmed. A video shows Sánchez reading the note, showing signs of worry, then crumpling up the note and continuing to sing. The following morning his corpse was found near the neighborhood of Los Laureles, Culiacán. He was blindfolded and his wrists were red and had rope marks. He had been shot in the back of the head twice.
